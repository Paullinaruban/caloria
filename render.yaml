# Render Blueprint for the Caloria backend.
#
# ⚙️  CURRENT MODE: PRODUCTION (~$7.25/mo)
#     • plan: starter        → always on, no cold starts, no data wipes
#     • persistent disk      → the database (accounts + Founding Members) survives
#                              restarts, redeploys and deploys
#     • CALORIA_DB on disk   → SQLite lives at /data/caloria.db
#
#     Production domain: https://caloriaclub.com (Netlify frontend).
#     CORS is locked to that origin; all email links are built from APP_BASE_URL.
#
#     Secrets (set once in the Render dashboard → Environment tab):
#       RESEND_API_KEY        -> re_...        (emails — REQUIRED for launch)
#       OPENAI_API_KEY        -> sk-...        (AI scan + coach)
#       STRIPE_SECRET_KEY     -> sk_live_...
#       STRIPE_WEBHOOK_SECRET -> whsec_...
#       (do NOT set DEV_UNLIMITED in production)
services:
  - type: web
    name: caloria-api
    runtime: python
    plan: starter
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /api/health

    disk:
      name: caloria-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: CALORIA_DB
        value: /data/caloria.db
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Production domain — referral links, email buttons and founder-status
      # links are all generated from this. CORS locks to the same origin.
      - key: APP_BASE_URL
        value: "https://caloriaclub.com"
      - key: ALLOWED_ORIGIN
        value: "https://caloriaclub.com"
      # Human sender + reply-able address: "noreply@" is a mild spam signal and
      # kills engagement; any address on the verified domain may send via Resend.
      - key: EMAIL_FROM
        value: "Paullina from Caloria <hello@caloriaclub.com>"
      # Replies land in a real inbox (personal touch + deliverability signal).
      - key: EMAIL_REPLY_TO
        value: "polinaryzova8@gmail.com"
      # Enforce email verification (requires RESEND_API_KEY above).
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: APP_SECRET
        generateValue: true
      # Admin allow-list — these emails can open /admin (dashboard + Caloria Club).
      - key: ADMIN_EMAILS
        value: "polinaryzova8@gmail.com"
      - key: EMAIL_RETENTION_ENABLED
        value: "true"
      # --- Founding Member badge (private launch) ---
      # After this day ends (UTC) the badge can never be granted again.
      - key: FOUNDING_MEMBER_DEADLINE
        value: "2026-07-12"
      # The private invite list is set in the Render dashboard (Environment tab),
      # NOT committed here, so the emails stay private:
      #   FOUNDING_MEMBER_EMAILS = comma-separated invited emails
      - key: FOUNDING_MEMBER_EMAILS
        sync: false
